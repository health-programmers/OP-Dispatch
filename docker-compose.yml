services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-op_dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-op_dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rest-api:
    build:
      context: ./rest-api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://op_dispatch:local-dev-only@postgres:5432/op_dispatch}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      WEB_APP_ORIGIN: http://localhost:${WEB_APP_PORT:-5173}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./rest-api/src:/app/src
      - rest_api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WEB_APP_ORIGIN: http://localhost:${WEB_APP_PORT:-5173}
    ports:
      - "${WEBSOCKET_PORT:-4000}:4000"
    volumes:
      - ./websocket/src:/app/src
      - websocket_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-http://localhost:4000}
    ports:
      - "${WEB_APP_PORT:-5173}:5173"
    volumes:
      - ./web-app/src:/app/src
      - ./web-app/index.html:/app/index.html
      - web_app_node_modules:/app/node_modules
    depends_on:
      rest-api:
        condition: service_healthy
      websocket:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rest_api_node_modules:
  websocket_node_modules:
  web_app_node_modules:
